name: Generate language icons

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate language icons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}

        run: |
          mkdir -p profile

          python <<'PY'
          import os
          import json
          import base64
          import urllib.request
          from collections import defaultdict

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "github-language-icons"
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read())

          # Busca os repositórios públicos do perfil
          repos = get_json(
              f"https://api.github.com/users/{owner}/repos"
              "?per_page=100&type=owner"
          )

          languages = defaultdict(int)

          for repo in repos:

              # Ignora forks e repositórios arquivados
              if repo.get("fork") or repo.get("archived"):
                  continue

              try:
                  repo_languages = get_json(repo["languages_url"])

                  for language, bytes_count in repo_languages.items():
                      languages[language] += bytes_count

              except Exception as error:
                  print(f"Não foi possível analisar {repo['name']}: {error}")

          # As 6 linguagens mais presentes nos repositórios
          top_languages = sorted(
              languages.items(),
              key=lambda item: item[1],
              reverse=True
          )[:6]

          print("Linguagens encontradas:")
          for language, amount in top_languages:
              print(language, amount)

          # Nome usado pelo GitHub -> ícone do Devicon
          icons = {
              "HTML": "html5",
              "CSS": "css3",
              "JavaScript": "javascript",
              "TypeScript": "typescript",
              "Python": "python",
              "Java": "java",
              "PHP": "php",
              "C": "c",
              "C++": "cplusplus",
              "C#": "csharp",
              "Go": "go",
              "Rust": "rust",
              "Ruby": "ruby",
              "Kotlin": "kotlin",
              "Swift": "swift",
              "Dart": "dart",
              "R": "r",
              "Shell": "bash",
              "Vue": "vuejs",
              "PLpgSQL": "postgresql"
          }

          rendered = []

          for language, amount in top_languages:

              icon_name = icons.get(language)

              if not icon_name:
                  print(f"Sem ícone configurado para {language}")
                  continue

              icon_url = (
                  "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/"
                  f"{icon_name}/{icon_name}-original.svg"
              )

              try:
                  request = urllib.request.Request(
                      icon_url,
                      headers={"User-Agent": "github-language-icons"}
                  )

                  with urllib.request.urlopen(request) as response:
                      icon = response.read()

                  encoded = base64.b64encode(icon).decode()

                  rendered.append((language, encoded))

              except Exception as error:
                  print(f"Erro baixando ícone de {language}: {error}")

          icon_size = 48
          gap = 22
          width = max(1, len(rendered)) * (icon_size + gap)
          height = 80

          elements = []

          for index, (language, encoded) in enumerate(rendered):

              x = index * (icon_size + gap)

              elements.append(
                  f'''
                  <image
                    x="{x}"
                    y="0"
                    width="{icon_size}"
                    height="{icon_size}"
                    href="data:image/svg+xml;base64,{encoded}"
                  />

                  <text
                    x="{x + icon_size / 2}"
                    y="68"
                    text-anchor="middle"
                    font-size="11"
                    font-family="Arial, sans-serif"
                    fill="#8b949e"
                  >
                    {language}
                  </text>
                  '''
              )

          svg = f'''
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
          >
            {''.join(elements)}
          </svg>
          '''

          with open("profile/languages-icons.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/languages-icons.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update language icons"
          git push
